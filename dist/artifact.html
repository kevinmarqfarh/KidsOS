rf\xF6r \xE4r solen s\xE5 varm?",a:"Inne i solen pressas sm\xE5 partiklar ihop s\xE5 h\xE5rt att de sm\xE4lter samman. Det kallas fusion och ger enorma m\xE4ngder energi \u2013 ljus och v\xE4rme.",think:"Vad skulle h\xE4nda med jorden utan solen?"},{id:"is-flyter",e:"\u{1F9CA}",cat:"Vetenskap",q:"Varf\xF6r flyter is?",a:"N\xE4r vatten fryser ordnar sig vattnets sm\xE5 delar i ett m\xF6nster med mer mellanrum. Isen blir lite l\xE4ttare \xE4n vattnet, s\xE5 den flyter. Tur f\xF6r fiskarna \u2013 sj\xF6arna fryser uppifr\xE5n!",think:"Vad tror du skulle h\xE4nda om isen sj\xF6nk?"},{id:"magnet",e:"\u{1F9F2}",cat:"Vetenskap",q:"Hur fungerar en magnet?",a:"I en magnet pekar massor av pyttesm\xE5 delar \xE5t samma h\xE5ll. Tillsammans skapar de en osynlig kraft som drar i j\xE4rn.",think:"Jorden \xE4r ocks\xE5 en stor magnet \u2013 vad anv\xE4nder man det till?"},{id:"brod",e:"\u{1F35E}",cat:"Vetenskap",q:"Varf\xF6r blir br\xF6det stort n\xE4r det j\xE4ser?",a:'J\xE4sten \xE4r sm\xE5 levande svampar som \xE4ter socker och "fiser" ut gasen koldioxid. Gasen blir bubblor som g\xF6r degen stor och luftig.',think:"Titta in i en br\xF6dskiva \u2013 kan du se h\xE5len efter bubblorna?"},{id:"ekar",e:"\u{1F50A}",cat:"Vetenskap",q:"Varf\xF6r kan det eka?",a:"Ljudet studsar mot en bergv\xE4gg eller ett stort hus och kommer tillbaka till dig \u2013 lite senare. Det \xE4r ett eko.",think:"Var har du h\xF6rt ett eko?"},{id:"lov",e:"\u{1F341}",cat:"Natur",q:"Varf\xF6r blir l\xF6ven gula och r\xF6da p\xE5 h\xF6sten?",a:"L\xF6ven \xE4r gr\xF6na av \xE4mnet klorofyll som hj\xE4lper tr\xE4det att g\xF6ra mat av solljus. P\xE5 h\xF6sten bryts det gr\xF6na ner \u2013 d\xE5 syns de gula och r\xF6da f\xE4rgerna som funnits d\xE4r hela tiden.",think:"Vilka tr\xE4d beh\xE5ller sina gr\xF6na barr hela vintern?"},{id:"regn",e:"\u{1F327}\uFE0F",cat:"Natur",q:"Var kommer regnet ifr\xE5n?",a:"Solen v\xE4rmer vatten i hav och sj\xF6ar s\xE5 att det avdunstar. Uppe i luften blir det kallt och vattnet bildar moln av sm\xE5 droppar. N\xE4r dropparna blir tunga faller de som regn.",think:"Samma vatten har kanske druckits av en dinosaurie \u2013 kan det st\xE4mma?"},{id:"dinosaurier",e:"\u{1F996}",cat:"Historia",q:"Hur vet vi hur dinosaurier s\xE5g ut?",a:"Forskare hittar fossil \u2013 ben som blivit sten under miljontals \xE5r. Som ett pussel bygger de ihop skeletten. Vissa fossil visar till och med fj\xE4drar!",think:"Vilka djur som lever i dag \xE4r sl\xE4kt med dinosaurierna? (Tips: de kan flyga.)"},{id:"internet",e:"\u{1F310}",cat:"Teknik",q:"Hur fungerar internet?",a:"Internet \xE4r miljontals datorer som \xE4r kopplade till varandra med sladdar under marken, i havet och via radiov\xE5gor. Meddelanden delas upp i sm\xE5 paket som hittar sin egen v\xE4g och s\xE4tts ihop igen.",think:"Hur tror du ett meddelande hittar r\xE4tt mottagare?"},{id:"flygplan",e:"\u2708\uFE0F",cat:"Teknik",q:"Hur kan ett tungt flygplan flyga?",a:"Vingarna \xE4r formade s\xE5 att luften som str\xF6mmar f\xF6rbi trycker planet upp\xE5t. Motorerna ser till att planet \xE5ker tillr\xE4ckligt fort fram\xE5t.",think:"Vik ett pappersflygplan \u2013 vad h\xE4nder om du b\xF6jer vingarna?"},{id:"robot",e:"\u{1F916}",cat:"Teknik",q:"Kan robotar t\xE4nka?",a:"Robotar f\xF6ljer program som m\xE4nniskor har skrivit. Vissa program kan l\xE4ra sig av exempel och verka smarta, men de f\xF6rst\xE5r inte saker p\xE5 samma s\xE4tt som du.",think:"Vad skulle du vilja att en robot hj\xE4lpte dig med?"},{id:"hav-salt",e:"\u{1F30A}",cat:"Natur",q:"Varf\xF6r \xE4r havet salt?",a:"Regn och floder tar med sig sm\xE5 m\xE4ngder salt fr\xE5n stenar och berg ut i havet. N\xE4r havsvattnet avdunstar stannar saltet kvar. Under v\xE4ldigt l\xE5ng tid har havet blivit salt.",think:"Varf\xF6r \xE4r det inte salt i sj\xF6arna?"},{id:"kittlas",e:"\u{1F92D}",cat:"Kroppen",q:"Varf\xF6r kan man inte kittla sig sj\xE4lv?",a:"Hj\xE4rnan vet redan vad din hand ska g\xF6ra, s\xE5 den blir inte \xF6verraskad. Kittlingar k\xE4nns
